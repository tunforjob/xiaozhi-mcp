[project]
name = "xiaozhi-mcp"
version = "0.1.0"
description = "xiaozhi-mcp project"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    "aiohttp",
    "aiohttp>=3.9.0",
    "bring-api>=1.1.0",
    "fastmcp>=2.13.0.2",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "httpx>=0.27.0",
    "mcp-proxy>=0.10.0",
    "mcp>=1.23.0",
    "pydantic>=2.12.3",
    "pyrogram>=2.0.0",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.3.0",
    "tgcrypto>=1.2.0",
    "websockets>=15.0.1",
    "httpx",
]

[project.scripts]
xiaozhi-mcp = "xiaozhi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.23.0",
]
# uv will read PEP 621 metadata
